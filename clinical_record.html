<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CareMate 電子カルテ</title><link rel="stylesheet" href="style.css"><script>if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark")</script><style>
.clinical-shell{max-width:1180px;margin:0 auto;padding:0 16px 96px}.clinical-notice{border-left:4px solid #d97706;background:#fffbeb;color:#713f12}.clinical-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}.clinical-side{position:sticky;top:12px;align-self:start}.clinical-side input{width:100%;box-sizing:border-box}.patient-list{display:grid;gap:8px;margin-top:12px}.patient-item{width:100%;text-align:left;border:1px solid var(--border);background:var(--card);border-radius:12px;padding:11px;cursor:pointer}.patient-item.active{border-color:#0f766e;background:#ecfdf5}.patient-item small{display:block;color:var(--subtext);margin-top:3px}.clinical-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.clinical-tabs button{white-space:nowrap;min-height:40px;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:0 12px;cursor:pointer}.clinical-tabs button.active{background:#0f766e;color:white;border-color:#0f766e}.record-form{display:grid;gap:10px}.record-form textarea,.record-form input,.record-form select{width:100%;box-sizing:border-box}.vitals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.record-line{border-left:3px solid #0f766e;padding:10px 12px;background:color-mix(in srgb,#0f766e 5%,var(--card));border-radius:0 10px 10px 0;margin-top:10px}.record-line .meta{color:var(--subtext);font-size:.84rem}.record-line .role{font-weight:700;color:#0f766e}.chart{display:grid;grid-template-columns:repeat(12,1fr);align-items:end;gap:6px;height:180px;padding:12px;border:1px solid var(--border);border-radius:12px;background:linear-gradient(to top,rgba(15,118,110,.07) 1px,transparent 1px);background-size:100% 25%}.chart i{display:block;background:linear-gradient(#2dd4bf,#0f766e);border-radius:7px 7px 2px 2px;min-height:4px;position:relative}.chart i span{position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;color:var(--subtext)}.chart-empty{height:180px;display:grid;place-items:center;color:var(--subtext);border:1px dashed var(--border);border-radius:12px}.patient-header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.patient-header h2{margin:0}.patient-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{padding:4px 8px;border-radius:999px;background:#e0f2fe;color:#075985;font-size:.78rem;font-weight:700}.danger-badge{background:#fee2e2;color:#b91c1c}.hidden{display:none!important}@media(max-width:780px){.clinical-grid{grid-template-columns:1fr}.clinical-side{position:static}.vitals{grid-template-columns:repeat(2,minmax(0,1fr))}.clinical-tabs{margin:0 -2px}.patient-header{flex-direction:column}.clinical-shell{padding-inline:12px}}
</style></head><body class="page-loading"><div class="top-buttons"><div class="top-user-info"><span id="userName">読み込み中</span><span id="myRanking"></span></div><div class="top-right"><button id="themeButton" class="circle-button">🌙</button><button id="profileButton" class="circle-button"><img id="topProfileImage" src="images/default.png" class="header-profile-image"></button></div></div><header class="header"><div class="logo">🏥</div><h1>CareMate 電子カルテ</h1><p>学習・演習用／架空患者のみ登録できます</p></header><main class="clinical-shell"><section class="card setting-card clinical-notice"><b>実在患者の個人情報は入力しないでください。</b><br><small>この機能は臨床記録の学習・演習を目的としたCareMateオリジナル機能です。診断・処方・医療判断には使えません。</small></section><div class="clinical-grid"><aside class="card setting-card clinical-side"><h2>患者一覧</h2><input id="patientSearch" placeholder="名前・IDで検索"><button id="newPatientButton" class="btn btn-primary" style="margin-top:10px">＋ 架空患者を登録</button><div id="patientList" class="patient-list">読み込み中...</div></aside><section id="clinicalMain" class="card setting-card"><div class="chart-empty">左の「架空患者を登録」から始めてください。</div></section></div></main><nav class="bottom-nav"><a href="index.html"><span class="nav-icon-wrap"><span class="nav-icon">🏠</span></span><span>ホーム</span></a><a href="assignments.html"><span class="nav-icon-wrap"><span class="nav-icon">📚</span></span><span>課題</span></a><a href="requests.html" class="active"><span class="nav-icon-wrap"><span class="nav-icon">💡</span></span><span>リクエスト</span></a><a href="news.html"><span class="nav-icon-wrap"><span class="nav-icon">📢</span></span><span>お知らせ</span></a><a id="settingsTab" href="settings.html"><span class="nav-icon-wrap"><span class="nav-icon">⚙️</span></span><span>設定</span></a></nav><script type="module" src="clinical_record.js"></script></body></html>
