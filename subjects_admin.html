<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>履修科目管理 | CareMateApp</title>

<link rel="stylesheet" href="style.css">

<script>
if(localStorage.getItem("theme") === "dark"){
    document.documentElement.classList.add("dark");
}
</script>

<style>

.subject-admin-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.subject-admin-actions .btn {
    flex: 1;
    min-width: 140px;
}

.subject-admin-summary {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.subject-admin-summary-item {
    flex: 1;
    min-width: 120px;
    padding: 12px;
    border-radius: 14px;
    background: rgba(127, 127, 127, 0.08);
    text-align: center;
}

.subject-editor-card {
    margin-bottom: 14px;
}

.subject-editor-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.subject-editor-grid .full-width {
    grid-column: 1 / -1;
}

.subject-editor-card input,
.subject-editor-card select {
    width: 100%;
    box-sizing: border-box;
}

.subject-editor-label {
    display: block;
    font-size: 13px;
    margin-bottom: 5px;
    opacity: 0.8;
}

.subject-required-row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 42px;
}

.subject-required-row input {
    width: auto;
}

.subject-delete-button {
    margin-top: 14px;
}

.subject-warning {
    margin-top: 10px;
    color: #d97706;
    font-size: 13px;
}

.subject-empty {
    padding: 30px 15px;
    text-align: center;
    opacity: 0.7;
}

@media (max-width: 600px) {

    .subject-editor-grid {
        grid-template-columns: 1fr;
    }

    .subject-editor-grid .full-width {
        grid-column: auto;
    }

}

.subject-incomplete-actions {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 10px;
}

.subject-incomplete-actions .btn {
    min-width: auto;
    padding: 8px 12px;
}

.subject-floating-actions {
    position: fixed;
    right: 14px;
    bottom: calc(82px + env(safe-area-inset-bottom));
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 9px;
}

.subject-floating-actions .btn {
    min-width: 112px;
    padding: 11px 14px;
    border-radius: 999px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
    font-size: 13px;
    white-space: nowrap;
}

.subject-floating-actions .btn:disabled {
    opacity: 0.55;
}

.subject-insert-area {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0 18px;
}

.subject-insert-area::before,
.subject-insert-area::after {
    content: "";
    height: 1px;
    flex: 1;
    background: rgba(127, 127, 127, 0.25);
}

.subject-insert-button {
    white-space: nowrap;
    padding: 8px 14px;
    font-size: 13px;
}

.subject-jump-highlight {
    animation: subjectJumpHighlight 1.5s ease;
}

@keyframes subjectJumpHighlight {

    0% {
        transform: scale(1);
    }

    35% {
        transform: scale(1.015);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
    }

    100% {
        transform: scale(1);
    }

}

.registration-admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.registration-admin-field label{display:block;margin-bottom:6px;font-size:13px;font-weight:700}
.registration-admin-field input,.registration-admin-field select,.registration-admin-field textarea{width:100%;box-sizing:border-box}
.registration-admin-field.full{grid-column:1/-1}
.registration-admin-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:12px;background:rgba(127,127,127,.08)}
.registration-admin-toggle input{width:22px;height:22px}
.registration-publish-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.registration-publish-actions .btn{flex:1;min-width:150px}
#registrationPublishStatus{margin-top:12px;font-size:13px;opacity:.8}
@media(max-width:600px){.registration-admin-grid{grid-template-columns:1fr}.registration-admin-field.full{grid-column:auto}}

</style>

</head>

<body class="page-loading">

<div class="top-buttons">

    <div class="top-user-info">

        <span id="userName">
            Unknownさん
        </span>

        <span id="myRanking"></span>

    </div>

    <div class="top-right">

        <button
            id="themeButton"
            class="circle-button">
            🌙
        </button>

        <button
            id="profileButton"
            class="circle-button">

            <img
                id="topProfileImage"
                src="images/default.png"
                class="header-profile-image">

        </button>

    </div>

</div>

<header class="header">

    <div class="logo">📝</div>

    <h1>履修科目管理</h1>

    <p>
        シラバス科目の確認・編集・登録
    </p>

</header>

<h2>📣 履修登録の公開設定</h2>

<div class="card setting-card">
    <div class="registration-admin-grid">
        <div class="registration-admin-field"><label for="registrationAcademicYear">対象年度</label><input id="registrationAcademicYear" type="number" min="2020" max="2100"></div>
        <div class="registration-admin-field"><label for="registrationSemester">対象学期</label><select id="registrationSemester"><option value="前期">前期</option><option value="後期">後期</option></select></div>
        <div class="registration-admin-field"><label for="registrationPhase">期間の種類</label><select id="registrationPhase"><option value="hidden">非公開</option><option value="registration">履修登録期間</option><option value="correction">履修修正期間</option><option value="cancellation">履修取消期間</option><option value="view_only">閲覧のみ</option></select></div>
        <div class="registration-admin-field"><label for="registrationCorrectionMode">修正期間の操作</label><select id="registrationCorrectionMode"><option value="add_delete">追加・削除</option><option value="delete_only">削除のみ</option></select></div>
        <div class="registration-admin-field"><label for="registrationStartAt">開始日時</label><input id="registrationStartAt" type="datetime-local"></div>
        <div class="registration-admin-field"><label for="registrationEndAt">終了日時</label><input id="registrationEndAt" type="datetime-local"></div>
        <div class="registration-admin-field full registration-admin-toggle"><span><b>ホーム上部の流れる案内</b><br><small>ホーム画面だけに表示します</small></span><input id="registrationBannerEnabled" type="checkbox"></div>
        <div class="registration-admin-field full"><label for="registrationBannerText">流す文章</label><textarea id="registrationBannerText" rows="2" placeholder="履修登録期間中！！ 4月10日17:00まで"></textarea></div>
        <div class="registration-admin-field"><label for="registrationBannerSpeed">表示速度</label><select id="registrationBannerSpeed"><option value="slow">ゆっくり</option><option value="normal">標準</option><option value="fast">速い</option></select></div>
        <div class="registration-admin-field registration-admin-toggle"><span><b>履修登録画面を開く</b></span><input id="registrationPageEnabled" type="checkbox"></div>
        <div class="registration-admin-field"><label for="semesterCreditLimit">半期の上限単位</label><input id="semesterCreditLimit" type="number" min="0"></div>
        <div class="registration-admin-field"><label for="annualCreditLimit">年間の上限単位</label><input id="annualCreditLimit" type="number" min="0"></div>
        <div class="registration-admin-field"><label for="graduationRequiredCredits">卒業必要単位</label><input id="graduationRequiredCredits" type="number" min="0"></div>
        <div class="registration-admin-field"><label for="electiveRequiredCredits">選択科目の必要単位</label><input id="electiveRequiredCredits" type="number" min="0"></div>
    </div>
    <div class="registration-publish-actions">
        <button id="saveRegistrationDraft" class="btn btn-secondary">下書き保存</button>
        <button id="previewRegistrationPage" class="btn btn-secondary">学生画面を確認</button>
        <button id="publishRegistrationSettings" class="btn btn-primary">学生側へ公開</button>
    </div>
    <div id="registrationPublishStatus">公開設定を読み込んでいます...</div>
</div>

<div class="card setting-card">

    <h3>subjects.jsonを読み込む</h3>

    <p>
        ローカルで作成したsubjects.jsonを選択してください。
    </p>

    <input
        id="subjectsJsonFile"
        type="file"
        accept=".json,application/json">

    <br><br>

    <button
        id="loadJsonButton"
        class="btn btn-primary">

        JSONを読み込む

    </button>

</div>

<div class="card setting-card">

    <h3>登録状況</h3>

    <div class="subject-admin-summary">

        <div class="subject-admin-summary-item">

            <small>表示科目</small>

            <div>
                <b id="subjectCount">0</b>科目
            </div>

        </div>

        <div class="subject-admin-summary-item">

            <small>未入力あり</small>

            <div>
                <b id="incompleteSubjectCount">0</b>科目
            </div>

        </div>

    </div>

</div>

<div class="card setting-card">

    <div class="subject-admin-actions">

        <button
            id="loadFirestoreSubjects"
            class="btn btn-secondary">

            Firestoreから読み込む

        </button>

        <button
            id="addSubjectButton"
            class="btn btn-secondary">

            ＋ 講義を追加

        </button>

        <button
            id="saveSubjectsButton"
            class="btn btn-primary">

            Firestoreへ保存

        </button>

    </div>

</div>

<h2>📚 科目一覧</h2>

<div id="subjectEditorList">

    <div class="subject-empty">
        JSONまたはFirestoreから科目を読み込んでください。
    </div>

</div>

<br>

<button
    class="btn btn-secondary"
    onclick="location.href='admin.html'">

    管理画面へ戻る

</button>

<div
    class="subject-floating-actions"
    aria-label="科目一覧の移動操作">

    <button
        id="incompleteNextButton"
        type="button"
        class="btn btn-primary"
        aria-label="次の未入力科目へ移動">

        未入力 🔻

    </button>

    <button
        id="scrollTopButton"
        type="button"
        class="btn btn-secondary"
        aria-label="ページの一番上へ移動">

        ⬆ 一番上へ

    </button>

</div>

<nav class="bottom-nav">

    <a href="index.html">
        🏠<br>
        <span>ホーム</span>
    </a>

    <a href="assignments.html">
        📚<br>
        <span>課題</span>
    </a>

    <a href="share.html">
        🤝<br>
        <span>共有</span>
    </a>

    <a href="news.html">
        📢<br>
        <span>お知らせ</span>
    </a>

    <a
        href="admin.html"
        class="active">

        👑<br>
        <span>管理</span>

    </a>

</nav>

<script
    type="module"
    src="subjects_admin.js">
</script>

</body>
</html>
