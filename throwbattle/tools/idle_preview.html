<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ハルト待機アニメーション確認・8 FPS</title>
  <style>
    body { margin: 0; padding: 24px; color: #17202b; font-family: system-ui, sans-serif; background: #eef1f4; }
    h1 { font-size: 22px; }
    .sheet { display: flex; gap: 24px; flex-wrap: wrap; align-items: start; }
    .checker { background-color: white; background-image: linear-gradient(45deg, #d8d8d8 25%, transparent 25%), linear-gradient(-45deg, #d8d8d8 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #d8d8d8 75%), linear-gradient(-45deg, transparent 75%, #d8d8d8 75%); background-size: 24px 24px; background-position: 0 0, 0 12px, 12px -12px, -12px 0; border: 1px solid #bbc3cc; }
    #playing { width: min(512px, 90vw); aspect-ratio: 1; object-fit: contain; }
    .frames { display: grid; grid-template-columns: repeat(2, minmax(110px, 180px)); gap: 12px; }
    .frames img { width: 100%; aspect-ratio: 1; object-fit: contain; }
    figure { margin: 0; }
    figcaption { margin-top: 5px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>ハルト・待機アニメーション（8 FPS / 4コマ）</h1>
  <div class="sheet">
    <figure><img class="checker" id="playing" src="../assets/characters/haruto/animations/idle_01.png" alt="8FPS再生"><figcaption id="state">再生中：1/4</figcaption></figure>
    <div class="frames">
      <figure><img class="checker" src="../assets/characters/haruto/animations/idle_01.png" alt="フレーム1"><figcaption>01</figcaption></figure>
      <figure><img class="checker" src="../assets/characters/haruto/animations/idle_02.png" alt="フレーム2"><figcaption>02</figcaption></figure>
      <figure><img class="checker" src="../assets/characters/haruto/animations/idle_03.png" alt="フレーム3"><figcaption>03</figcaption></figure>
      <figure><img class="checker" src="../assets/characters/haruto/animations/idle_04.png" alt="フレーム4"><figcaption>04</figcaption></figure>
    </div>
  </div>
  <script>
    const paths = [1, 2, 3, 4].map(i => `../assets/characters/haruto/animations/idle_0${i}.png`);
    let frame = 0;
    setInterval(() => { frame = (frame + 1) % paths.length; document.getElementById('playing').src = paths[frame]; document.getElementById('state').textContent = `再生中：${frame + 1}/4`; }, 125);
  </script>
</body>
</html>
