<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Throb・ハルト走行パーツ分割試作</title>
  <style>
    :root { font: 16px/1.5 system-ui, sans-serif; color: #172638; background: #e9eef3; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1190px; margin: auto; padding: 18px; }
    h1 { font-size: clamp(22px, 3vw, 30px); margin: 0 0 8px; }
    p { margin: 0 0 14px; }
    .notice { background: #fff2d2; border-left: 5px solid #db9100; padding: 10px 14px; border-radius: 6px; }
    .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    figure { margin: 0; min-width: 0; border-radius: 16px; padding: 12px; background: white; box-shadow: 0 6px 24px #293c4b16; }
    figcaption { font-weight: 750; margin-bottom: 8px; }
    canvas { display: block; width: 100%; aspect-ratio: 1; border-radius: 8px; background-color: #e5ebf0; background-image: linear-gradient(45deg,#cad5dd 25%,transparent 25%),linear-gradient(-45deg,#cad5dd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cad5dd 75%),linear-gradient(-45deg,transparent 75%,#cad5dd 75%); background-position: 0 0,0 16px,16px -16px,-16px 0; background-size: 32px 32px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; background: white; padding: 13px; border-radius: 12px; margin-top: 16px; }
    button, input { font: inherit; }
    button { cursor: pointer; border: 1px solid #8fa6bb; border-radius: 8px; padding: 7px 13px; background: #f6f9fc; color: #172638; }
    label { display: inline-flex; align-items: center; gap: 7px; }
    input[type=range] { width: min(210px, 42vw); }
    .details { margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: white; }
    .details ul { margin-bottom: 0; }
    @media (max-width: 720px) { .comparison { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>ハルト走行：従来版とパーツ分割試作</h1>
  <p class="notice">技術検証専用です。元の44枚、キャラクター設定、ゲームの表示・当たり判定は変更していません。右側は正式素材ではありません。</p>
  <div class="comparison">
    <figure><figcaption>従来版：登録済みの走行4コマ</figcaption><canvas id="original" width="512" height="512"></canvas></figure>
    <figure><figcaption>試作：既存の待機1枚を8部位に分けて動かす</figcaption><canvas id="rig" width="512" height="512"></canvas></figure>
  </div>
  <div class="controls">
    <button id="toggle" type="button">一時停止</button>
    <button id="previous" type="button">前の姿勢</button>
    <button id="next" type="button">次の姿勢</button>
    <label>速さ <input id="speed" type="range" min="2" max="16" value="8"> <output id="speedValue">8</output>姿勢/秒</label>
    <label><input id="guides" type="checkbox"> 関節・足元ガイド</label>
    <span id="phase" role="status">読み込み中</span>
  </div>
  <div class="details">
    <strong>検証する点</strong>
    <ul>
      <li>8姿勢を1周期にし、左右の脚と腕を逆位相で動かす実験です。靴を脚と別に動かし、低い側の靴底を基準線へ寄せています。ただし交互の接地は未達です。</li>
      <li>顔・髪・衣装は同じ原画から切り出すため変化しません。一方、原画に描かれていない関節の裏側や、脚の前後が逆になった際の靴側面は復元できません。</li>
      <li>半周期で両足が重なる、足が滑る、膝が曲がらない、隠れた関節が欠けるため、この試作は正式採用不可です。</li>
    </ul>
  </div>
</main>
<script type="module">
  const sourcePath = '../assets/characters/haruto/animations/idle_01.png';
  const originalPaths = [1,2,3,4].map(n => `../assets/characters/haruto/animations/run_0${n}.png`);
  const $ = id => document.getElementById(id);
  const original = $('original').getContext('2d');
  const rig = $('rig').getContext('2d');
  const load = url => new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`読み込めません: ${url}`));
    img.src = url;
  });
  // These hand-measured masks are intentionally confined to this prototype.
  // They demonstrate where a single flattened illustration hides joint surfaces.
  const shapes = {
    rearLeg: { pivot:[233,359], ankle:[178,428], points:[[165,344],[265,343],[267,380],[247,405],[238,452],[123,452],[136,415],[163,397]] },
    frontLeg: { pivot:[284,357], ankle:[318,429], points:[[252,344],[334,347],[340,387],[363,409],[377,453],[263,453],[264,399]] },
    rearBoot: { pivot:[178,428], points:[[145,408],[182,397],[221,408],[240,442],[238,491],[110,491],[111,447],[128,418]] },
    frontBoot: { pivot:[318,429], points:[[278,407],[322,395],[357,414],[398,441],[398,491],[258,491],[260,440]] },
    rearArm: { pivot:[207,270], points:[[196,248],[247,265],[245,309],[215,339],[160,346],[151,320],[166,283]] },
    torso: { pivot:[256,346], points:[[199,258],[225,245],[294,256],[317,280],[341,349],[326,390],[184,390],[176,349]] },
    head: { pivot:[260,253], points:[[119,44],[302,38],[388,84],[401,169],[365,245],[320,282],[219,277],[150,249],[126,199]] },
    frontArm: { pivot:[302,281], points:[[296,259],[335,269],[366,289],[382,326],[365,353],[323,343],[297,310]] }
  };
  function partImage(source, points) {
    const c = document.createElement('canvas'); c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.beginPath(); points.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.closePath(); ctx.clip();
    ctx.drawImage(source,0,0);
    return c;
  }
  function drawPart(ctx, part, angle, dx=0, dy=0) {
    const [px,py] = part.pivot;
    ctx.save(); ctx.translate(px+dx,py+dy); ctx.rotate(angle); ctx.translate(-px,-py);
    ctx.drawImage(part.image,0,0); ctx.restore();
  }
  function guide(ctx, step, footOffset) {
    ctx.save(); ctx.strokeStyle = '#008e75'; ctx.setLineDash([7,5]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0,488); ctx.lineTo(512,488); ctx.stroke(); ctx.setLineDash([]);
    for (const [name,color] of [['rearLeg','#663fca'],['frontLeg','#e04a3b'],['rearArm','#663fca'],['frontArm','#e04a3b']]) {
      const [x,y] = shapes[name].pivot; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y-footOffset,5,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle='#172638'; ctx.font='bold 15px system-ui'; ctx.fillText(`姿勢 ${step+1}/8`,12,25);
    ctx.restore();
  }
  let running = true, step = 0, last = 0, elapsed = 0, parts, frames;
  function render() {
    original.clearRect(0,0,512,512); rig.clearRect(0,0,512,512);
    original.drawImage(frames[Math.floor(step/2)],0,0);
    // Opposing swing uses a complete 8-step cycle; each leg alternates between
    // forward and backward. The source artwork itself contains no hidden side.
    const theta = step * Math.PI / 4;
    const rearAngle = -0.5*(1-Math.cos(theta));
    const frontAngle = 0.5*(1-Math.cos(theta));
    const rearArmAngle = -0.45*(1+Math.cos(theta));
    const frontArmAngle = 0.45*(1+Math.cos(theta));
    const ankleAfterRotation = (leg,angle) => {
      const [px,py]=leg.pivot, [ax,ay]=leg.ankle, dx=ax-px, dy=ay-py;
      return [px+dx*Math.cos(angle)-dy*Math.sin(angle),py+dx*Math.sin(angle)+dy*Math.cos(angle)];
    };
    const rearAnkle=ankleAfterRotation(parts.rearLeg,rearAngle);
    const frontAnkle=ankleAfterRotation(parts.frontLeg,frontAngle);
    const rearSole=488+rearAnkle[1]-parts.rearBoot.pivot[1];
    const frontSole=488+frontAnkle[1]-parts.frontBoot.pivot[1];
    const footOffset=Math.max(rearSole,frontSole)-488;
    const flight=Math.abs(Math.sin(theta))*4;
    rig.save(); rig.translate(0,-footOffset-flight);
    drawPart(rig,parts.rearLeg,rearAngle);
    drawPart(rig,parts.rearBoot,0,rearAnkle[0]-parts.rearBoot.pivot[0],rearAnkle[1]-parts.rearBoot.pivot[1]);
    drawPart(rig,parts.rearArm,rearArmAngle);
    drawPart(rig,parts.frontLeg,frontAngle);
    drawPart(rig,parts.frontBoot,0,frontAnkle[0]-parts.frontBoot.pivot[0],frontAnkle[1]-parts.frontBoot.pivot[1]);
    drawPart(rig,parts.torso,0);
    drawPart(rig,parts.head,0);
    drawPart(rig,parts.frontArm,frontArmAngle);
    rig.restore();
    if ($('guides').checked) { guide(rig,step,footOffset+flight); guide(original,step,0); }
    $('phase').textContent = `姿勢 ${step+1} / 8`;
  }
  function tick(now) {
    const dt = Math.min((now-(last||now))/1000,0.1); last=now;
    if (running) { elapsed += dt; const next = Math.floor(elapsed*Number($('speed').value))%8; if(next!==step){ step=next; render(); } }
    requestAnimationFrame(tick);
  }
  $('toggle').onclick = () => { running=!running; $('toggle').textContent=running?'一時停止':'再生'; };
  for (const [id,dir] of [['previous',-1],['next',1]]) $(id).onclick=()=>{ running=false; $('toggle').textContent='再生'; step=(step+dir+8)%8; elapsed=step/Number($('speed').value); render(); };
  $('speed').oninput=()=>{ $('speedValue').value=$('speed').value; elapsed=step/Number($('speed').value); };
  $('guides').onchange=()=>render();
  try {
    const [source,...loaded] = await Promise.all([load(sourcePath),...originalPaths.map(load)]);
    frames=loaded;
    parts=Object.fromEntries(Object.entries(shapes).map(([key,shape])=>[key,{...shape,image:partImage(source,shape.points)}]));
    render(); requestAnimationFrame(tick);
  } catch(error) { $('phase').textContent=error.message+'。ローカルサーバーで開いてください。'; }
</script>
</body>
</html>
