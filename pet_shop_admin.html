<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ペット商品管理 | CareMate</title>
  <link rel="stylesheet" href="style.css?v=20261015-1" />
  <link rel="stylesheet" href="pet.css?v=20261017-1" />
  <link rel="stylesheet" href="pet_refinements.css?v=20261018-1" />
  <script defer src="loading_indicator.js?v=20260929-7"></script>
  <script>if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");</script>
</head>
<body class="page-loading">
  <div class="top-buttons"><div class="top-user-info"><span id="userName">管理者</span><span id="myRanking"></span></div><div class="top-right"><button id="themeButton" class="circle-button">🌙</button><button id="profileButton" class="circle-button"><img id="topProfileImage" src="images/default.png" class="header-profile-image" alt="プロフィール" /></button></div></div>
  <header class="header"><div class="logo">🐾</div><h1>ペット商品管理</h1><p>ごはん・おもちゃの販売設定</p></header>
  <main class="pet-admin-main">
    <div class="card setting-card"><button id="backToUsers" class="btn">← ユーザー管理へ戻る</button><p>商品画像は先に <code>assets/pets/food/</code> または <code>assets/pets/toys/</code> へPNGを追加してから、そのパスを登録してください。</p></div>
    <section class="card setting-card"><h2 id="petItemFormTitle">商品を追加</h2>
      <form id="petItemForm" class="pet-admin-form">
        <label>種類<select id="itemKind"><option value="food">ごはん</option><option value="toy">おもちゃ</option></select></label>
        <label>商品ID<input id="itemId" required pattern="[a-z0-9-]{2,40}" placeholder="例：leaf-toy" /></label>
        <label>表示名<input id="itemName" required maxlength="30" placeholder="商品名" /></label>
        <label>画像パス<input id="itemImagePath" required placeholder="assets/pets/food/item.png" /></label>
        <label>価格（学習ポイント）<input id="itemPrice" type="number" min="0" max="100000" value="10" required /></label>
        <label class="food-only">ペットの好み<select id="itemPreference"><option>大好物</option><option>好物</option><option selected>普通</option><option>嫌い</option><option>食べたくない</option></select></label>
        <label class="food-only">満足度（0〜100）<input id="itemSatisfaction" type="number" min="0" max="100" value="20" /></label>
        <label class="food-only">満腹度の上昇（0〜100）<input id="itemFullnessGain" type="number" min="0" max="100" value="20" /></label>
        <label class="pet-admin-check food-only"><input id="itemInfinite" type="checkbox" /> 無限に選べる（販売在庫∞）</label>
        <label class="pet-admin-check"><input id="itemShopAvailable" type="checkbox" checked /> ショップに表示</label>
        <label class="pet-admin-check"><input id="itemEnabled" type="checkbox" checked /> 有効</label>
        <div class="pet-admin-actions"><button id="petItemSave" class="btn btn-primary" type="submit">保存</button><button id="petItemNew" class="btn" type="button">新規入力</button></div>
      </form>
    </section>
    <section><h2>登録商品</h2><div id="petItemList" class="pet-admin-list" aria-live="polite">読み込み中…</div></section>
    <p id="petAdminStatus" class="pet-admin-status" role="status"></p>
  </main>
  <script type="module" src="pet_shop_admin.js?v=20261018-1"></script>
</body>
</html>
