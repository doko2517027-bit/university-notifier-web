<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f9d8a">
  <title>メイトーク | CareMate</title>
  <link rel="stylesheet" href="style.css?v=20261015-2">
  <link rel="stylesheet" href="matetalk.css?v=20261016-2">
</head>
<body class="page-loading matetalk-page">
  <header class="matetalk-topbar">
    <div>
      <p>CareMate</p>
      <h1>メイトーク</h1>
    </div>
    <div class="matetalk-top-actions">
      <div id="mateModeSwitch" class="mate-mode-switch" hidden>
        <button type="button" data-mode="student" class="active">学生</button>
        <button type="button" data-mode="admin">管理者</button>
      </div>
      <button id="mateSettingsButton" class="mate-icon-button" type="button" aria-label="メイトーク設定">⚙️</button>
    </div>
  </header>

  <main class="mate-shell">
    <aside id="mateRoomPanel" class="mate-room-panel">
      <div class="mate-room-toolbar">
        <div>
          <b id="mateRoomHeading">トーク</b>
          <small id="mateRoomCount">読み込み中</small>
        </div>
        <button id="mateAddFriendButton" class="mate-add-button" type="button">＋ 交換</button>
      </div>
      <label class="mate-search">
        <span>🔎</span>
        <input id="mateRoomSearch" type="search" placeholder="名前・ニックネームで検索" autocomplete="off">
      </label>
      <div id="mateRoomList" class="mate-room-list" aria-live="polite">
        <div class="mate-loading-card">トークを準備しています…</div>
      </div>
    </aside>

    <section id="mateConversationPanel" class="mate-conversation-panel" aria-label="チャット">
      <div id="mateEmptyState" class="mate-empty-state">
        <span>💬</span>
        <h2>話す相手を選んでください</h2>
        <p>学生同士はアカウント交換後に、システム管理者とはすぐに話せます。</p>
      </div>
      <div id="mateConversation" class="mate-conversation" hidden>
        <header class="mate-chat-header">
          <button id="mateChatBack" class="mate-chat-back" type="button" aria-label="トーク一覧へ戻る">‹</button>
          <img id="mateChatPhoto" src="images/default.png" alt="">
          <div>
            <b id="mateChatName">メイトーク</b>
            <small id="mateChatStatus">チャット</small>
          </div>
          <button id="mateRenameButton" class="mate-header-button" type="button">表示名</button>
          <button id="mateScheduleButton" class="mate-header-button is-primary" type="button">📅 予定共有</button>
        </header>
        <div id="mateMessageList" class="mate-message-list" aria-live="polite"></div>
        <form id="mateMessageForm" class="mate-composer">
          <button class="mate-media-button" type="button" disabled aria-label="写真と動画は準備中">
            <span>📷</span><i>COMING SOON</i>
          </button>
          <textarea id="mateMessageInput" rows="1" maxlength="2000" placeholder="メッセージを入力" enterkeyhint="send"></textarea>
          <button id="mateSendButton" class="mate-send-button" type="submit">送信</button>
        </form>
      </div>
    </section>
  </main>

  <div id="mateSettingsOverlay" class="mate-overlay" hidden>
    <section class="mate-modal" role="dialog" aria-modal="true" aria-labelledby="mateSettingsTitle">
      <button class="mate-modal-close" type="button" data-close="settings" aria-label="閉じる">×</button>
      <p class="mate-kicker">メイトーク設定</p>
      <h2 id="mateSettingsTitle">あなたのプロフィール</h2>
      <label>ニックネーム<input id="mateNicknameInput" maxlength="20" placeholder="友達に表示する名前"></label>
      <label class="mate-toggle-row"><input id="mateExchangeEnabled" type="checkbox"><span>ID・QRでアカウント交換を受け付ける</span></label>
      <label id="mateExchangeIdField">交換ID<input id="mateExchangeIdInput" maxlength="20" inputmode="latin" autocapitalize="none" placeholder="英数字4〜20文字"></label>
      <div id="mateQrBox" class="mate-qr-box" hidden><div id="mateQrCode"></div><small>相手のカメラで読み取ってください</small></div>
      <p id="mateSettingsMessage" class="mate-form-message"></p>
      <button id="mateSaveSettings" class="mate-primary-button" type="button">設定を保存</button>
      <button id="mateSkipSettings" class="mate-secondary-button" type="button">今は設定しない</button>
    </section>
  </div>

  <div id="mateExchangeOverlay" class="mate-overlay" hidden>
    <section class="mate-modal" role="dialog" aria-modal="true" aria-labelledby="mateExchangeTitle">
      <button class="mate-modal-close" type="button" data-close="exchange" aria-label="閉じる">×</button>
      <p class="mate-kicker">アカウント交換</p>
      <h2 id="mateExchangeTitle">友達の交換IDを入力</h2>
      <p>交換すると、お互いのトーク一覧に追加されます。</p>
      <label>交換ID<input id="mateFriendIdInput" maxlength="20" inputmode="latin" autocapitalize="none" placeholder="例：kohei_44"></label>
      <p id="mateExchangeMessage" class="mate-form-message"></p>
      <button id="mateConnectFriend" class="mate-primary-button" type="button">交換してトークを開く</button>
    </section>
  </div>

  <div id="mateScheduleOverlay" class="mate-overlay mate-schedule-overlay" hidden>
    <section class="mate-modal mate-schedule-modal" role="dialog" aria-modal="true" aria-labelledby="mateScheduleTitle">
      <button class="mate-modal-close" type="button" data-close="schedule" aria-label="閉じる">×</button>
      <p class="mate-kicker">予定共有</p>
      <h2 id="mateScheduleTitle">ふたりの予定</h2>
      <div class="mate-schedule-switch">
        <button type="button" data-owner="both" class="active">一緒に表示</button>
        <button id="mateMineScheduleTab" type="button" data-owner="mine">自分の予定</button>
        <button id="mateTheirScheduleTab" type="button" data-owner="theirs">相手の予定</button>
      </div>
      <p class="mate-schedule-note">自分の予定は「相手に見せる」をオフにすると、相手側には表示されません。</p>
      <div id="mateScheduleList" class="mate-schedule-list"><div class="mate-loading-card">予定を読み込み中…</div></div>
    </section>
  </div>

  <div id="mateRenameOverlay" class="mate-overlay" hidden>
    <section class="mate-modal" role="dialog" aria-modal="true" aria-labelledby="mateRenameTitle">
      <button class="mate-modal-close" type="button" data-close="rename" aria-label="閉じる">×</button>
      <p class="mate-kicker">自分だけの表示</p>
      <h2 id="mateRenameTitle">友達の表示名を変更</h2>
      <label>表示名<input id="mateAliasInput" maxlength="30" placeholder="未入力でニックネームに戻す"></label>
      <button id="mateSaveAlias" class="mate-primary-button" type="button">保存</button>
    </section>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><span class="nav-icon-wrap"><span class="nav-icon">🏠</span></span><span>ホーム</span></a>
    <a href="assignments.html"><span class="nav-icon-wrap"><span class="nav-icon">📚</span></span><span>課題</span></a>
    <a href="news.html"><span class="nav-icon-wrap"><span class="nav-icon">📢</span></span><span>お知らせ</span></a>
    <a href="settings.html"><span class="nav-icon-wrap"><span class="nav-icon">⚙️</span></span><span>設定</span></a>
  </nav>

  <script src="vendor/qrcode.min.js?v=20261016-1"></script>
  <script type="module" src="matetalk.js?v=20261016-2"></script>
</body>
</html>
