<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2563eb" />
    <title>保護者用時間割 | CareMateApp</title>
    <link rel="stylesheet" href="style.css?v=20261001-5" />
    <script defer src="loading_indicator.js?v=20260929-7"></script>
  </head>
  <body class="page-loading guardian-page">
    <header class="header">
      <div class="logo">👪</div>
      <h1>保護者用時間割</h1>
      <p id="guardianStudentLabel">学生の時間割を読み込んでいます</p>
    </header>
    <main class="guardian-timetable-main">
      <div class="card setting-card guardian-info-card">
        <strong>閲覧専用</strong>
        <p>連携した学生の履修科目と学校共通予定だけを表示します。編集はできません。</p>
      </div>
      <div class="guardian-timetable-toolbar card setting-card">
        <button id="previousWeek" class="btn" type="button">← 前の週</button>
        <strong id="guardianWeekLabel">--</strong>
        <button id="nextWeek" class="btn" type="button">次の週 →</button>
      </div>
      <div id="guardianTimetable" class="guardian-timetable-list">
        <div class="card setting-card">時間割を読み込んでいます…</div>
      </div>
      <button id="guardianLogout" class="btn btn-primary guardian-logout-button" type="button">ログアウト</button>
    </main>
    <footer id="version"></footer>
    <script type="module" src="guardian_timetable.js?v=20261001-1"></script>
  </body>
</html>
