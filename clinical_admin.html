<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>病院管理 | CareMate Clinical</title><link rel="stylesheet" href="style.css"><script>if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark")</script><style>.clinical-admin{max-width:760px;margin:0 auto;padding:0 16px 96px}.clinical-admin .card{margin-bottom:14px}.clinical-step{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}.clinical-step b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#0f766e;color:#fff}.clinical-note{color:var(--subtext);font-size:.9rem}.clinical-staff-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}.clinical-staff-row:last-child{border-bottom:0}.clinical-staff-actions{display:flex;gap:6px;flex-wrap:wrap}.clinical-staff-actions button{min-height:34px}@media(max-width:560px){.clinical-staff-row{align-items:flex-start;flex-direction:column}}</style></head><body class="page-loading"><div class="top-buttons"><div class="top-user-info"><span id="userName">読み込み中</span></div><div class="top-right"><button id="themeButton" class="circle-button">🌙</button><button id="profileButton" class="circle-button"><img id="topProfileImage" src="images/default.png" class="header-profile-image"></button></div></div><header class="header"><div class="logo">🏥</div><h1>病院管理</h1><p id="hospitalLabel">CareMate Clinical</p></header><main class="clinical-admin"><section class="card setting-card"><h2>病院管理者</h2><p class="clinical-note">病院管理者は、この病院の職員登録・職種の編集・患者登録・記録の管理を行います。</p></section><section class="card setting-card"><h2>職員・職種を登録</h2><p class="clinical-note">登録済みのCareMateアカウントを、この病院の職員として追加します。</p><form id="staffForm"><label>病院ID<input id="hospitalId" required readonly></label><label>職員ID<input id="staffUid" required inputmode="numeric" maxlength="7" placeholder="例：2510044"></label><label>職種<select id="staffRole"><option value="doctor">医師</option><option value="nurse">看護師</option><option value="pharmacist">薬剤師</option><option value="pt">理学療法士（PT）</option><option value="ot">作業療法士（OT）</option><option value="st">言語聴覚士（ST）</option><option value="clerk">医事・受付</option><option value="auditor">監査担当</option></select></label><button class="btn btn-primary">職員を登録する</button></form><p id="staffStatus" aria-live="polite"></p></section><section class="card setting-card"><h2>登録済み職員</h2><div id="staffList">読み込み中...</div></section><section class="card setting-card"><h2>今後の管理機能</h2><div class="clinical-step"><b>1</b><p><strong>患者登録・受付</strong><br><small>病院管理者または医事が、患者の受付と基本情報を管理します。</small></p></div><div class="clinical-step"><b>2</b><p><strong>多職種記録</strong><br><small>職種ごとの記録・指示・承認・監査を分けて管理します。</small></p></div></section><p><a href="clinical_portal.html" class="btn btn-secondary">Clinicalへ戻る</a></p></main><nav class="bottom-nav"><a href="index.html"><span class="nav-icon-wrap"><span class="nav-icon">🏠</span></span><span>ホーム</span></a><a href="assignments.html"><span class="nav-icon-wrap"><span class="nav-icon">📚</span></span><span>課題</span></a><a href="requests.html" class="active"><span class="nav-icon-wrap"><span class="nav-icon">💡</span></span><span>リクエスト</span></a><a href="news.html"><span class="nav-icon-wrap"><span class="nav-icon">📢</span></span><span>お知らせ</span></a><a id="settingsTab" href="settings.html"><span class="nav-icon-wrap"><span class="nav-icon">⚙️</span></span><span>設定</span></a></nav><script type="module" src="clinical_admin.js"></script></body></html>
