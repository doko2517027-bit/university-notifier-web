<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2d65bd">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="caremate_shell.css?v=20261020-3">
  <title>ホーム | CareMate</title>
</head>
<body class="caremate-renewed">
  <main class="cm-main">
    <header class="cm-header"><div><span class="cm-brand">CareMate</span><h1 class="cm-title">ホーム</h1></div></header>
    <section class="cm-panel cm-home-clock">
      <p class="cm-subtitle">現在の日時</p>
      <time id="currentDateTime" class="cm-current-datetime" aria-live="off">読み込み中…</time>
    </section>
    <section class="cm-panel">
      <div class="cm-calendar-header"><h2>課題カレンダー</h2><div class="cm-calendar-controls"><button id="previousMonth" type="button" aria-label="前の月">‹</button><strong id="calendarMonth"></strong><button id="nextMonth" type="button" aria-label="次の月">›</button></div></div>
      <div class="cm-calendar-weekdays" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
      <div id="calendarGrid" class="cm-calendar-grid" aria-label="課題カレンダー"></div>
      <h3 id="calendarDateTitle" class="cm-calendar-date-title">日付を選択してください</h3>
      <div id="calendarDayItems" class="cm-list" aria-live="polite"></div>
      <a class="cm-button" href="assignments.html">課題一覧を開く</a>
    </section>
  </main>
  <nav class="cm-nav" aria-label="メインメニュー"></nav>
  <script type="module" src="page_bootstrap.js" data-care-page data-entry="./home.js"></script>
</body>
</html>
