<!doctype html>
<html lang="ja">
<head>
    <script src="ui_preferences.js?v=20261020-3"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f9d8a">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="caremate_shell.css?v=20261021-1">
  <title>ホーム | CareMate</title>
</head>
<body class="caremate-renewed">
  <main class="cm-main">
    <header class="cm-header"><div><span class="cm-brand">CareMate</span><h1 class="cm-title">ホーム</h1></div></header>
    <section class="cm-panel cm-home-clock">
      <p class="cm-subtitle">現在の日時</p>
      <time id="currentDateTime" class="cm-current-datetime" aria-live="off">読み込み中…</time>
    </section>
    <section class="cm-panel">
      <div class="cm-calendar-header"><div><h2><span data-assignment-only>課題・</span>予定カレンダー</h2><p class="cm-subtitle">日付を選ぶと、その日の<span data-assignment-only>課題と</span>予定を確認できます。</p></div><div class="cm-calendar-controls"><button id="previousMonth" type="button" aria-label="前の月">‹</button><strong id="calendarMonth"></strong><button id="nextMonth" type="button" aria-label="次の月">›</button></div></div>
      <div class="cm-calendar-weekdays" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
      <div id="calendarGrid" class="cm-calendar-grid" aria-label="課題カレンダー"></div>
    </section>
  </main>
  <div id="calendarDayOverlay" class="cm-overlay" hidden>
    <section class="cm-dialog" role="dialog" aria-modal="true" aria-labelledby="calendarDateTitle">
      <button id="closeCalendarDialog" class="cm-dialog-close" type="button" aria-label="閉じる">×</button>
      <h2 id="calendarDateTitle"></h2>
      <div id="calendarDayItems" class="cm-list" aria-live="polite"></div>
      <button id="addPersonalEvent" class="cm-button cm-button-primary" type="button">＋ 自分の予定を追加</button>
    </section>
  </div>
  <div id="personalEventOverlay" class="cm-overlay" hidden>
    <form id="personalEventForm" class="cm-dialog cm-dialog-form" role="dialog" aria-modal="true" aria-labelledby="personalEventTitle">
      <button id="closeEventForm" class="cm-dialog-close" type="button" aria-label="閉じる">×</button>
      <h2 id="personalEventTitle">自分の予定を追加</h2>
      <p id="personalEventDate" class="cm-subtitle"></p>
      <label class="cm-field">予定名<input name="title" maxlength="80" required autocomplete="off" placeholder="予定の名前"></label>
      <label class="cm-field">時間（任意）<input name="time" type="time"></label>
      <label class="cm-field">メモ（任意）<textarea name="note" maxlength="500" rows="3" placeholder="場所やメモ"></textarea></label>
      <p id="personalEventStatus" class="cm-status" aria-live="polite"></p>
      <button class="cm-button cm-button-primary" type="submit">予定を保存</button>
    </form>
  </div>
  <nav class="cm-nav" aria-label="メインメニュー"></nav>
  <script type="module" src="page_bootstrap.js?v=20261021-2" data-care-page data-entry="./home.js?v=20261021-1"></script>
</body>
</html>
