<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通報問題の修正 | CareMate</title><link rel="stylesheet" href="style.css"><script>if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark")</script></head><body class="page-loading"><div class="top-buttons"><button id="backButton" class="circle-button">←</button><h2>通報問題を修正</h2><div></div></div><main class="card setting-card question-report-editor"><p id="questionLocation">読み込み中...</p><label>問題文<textarea id="editReportedQuestion" rows="5"></textarea></label><label id="choicesField">選択肢（1行につき1つ）<textarea id="editReportedChoices" rows="6"></textarea></label><label id="answerNumberField">正解番号<input id="editReportedAnswerNumber" type="number" min="1"></label><label id="answersField" hidden>正解（1行につき1つ）<textarea id="editReportedAnswers" rows="5"></textarea></label><label id="explanationField">解説<textarea id="editReportedExplanation" rows="5"></textarea></label><button id="saveReportedQuestion" class="main-button">修正して公開問題へ反映</button><p class="attendance-personal-notice">保存すると学生に公開中の問題と管理者編集データの両方へ反映し、この通報を対応済みにします。</p></main><script type="module" src="question_report_edit.js"></script></body></html>
