<!doctype html>
<html lang="ja">
  <head>
    <script src="page_status.js?v=20261029-1"></script>
    <script src="ui_preferences.js?v=20261028-3"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>通報問題の修正 | CareMate</title>
    <link rel="stylesheet" href="style.css?v=20261020-3" />
    <script defer src="loading_indicator.js?v=20261029-1"></script>
    <script>
      if (localStorage.getItem("theme") === "dark")
        document.documentElement.classList.add("dark");
    </script>
    <link rel="stylesheet" href="caremate_shell.css?v=20261020-6">
  </head>
  <body class="page-loading">
    <div class="top-buttons">
      <button id="backButton" class="circle-button">←</button>
      <h2>通報問題を修正</h2>
      <div></div>
    </div>
    <main class="card setting-card question-report-editor">
      <p id="questionLocation">読み込み中...</p>
      <label
        >問題文<textarea id="editReportedQuestion" rows="5"></textarea></label
      ><label id="choicesField"
        >選択肢（1行につき1つ）<textarea
          id="editReportedChoices"
          rows="6"
        ></textarea></label
      ><label id="answerNumberField"
        >正解番号<input
          id="editReportedAnswerNumber"
          type="number"
          min="1" /></label
      ><label id="answersField" hidden
        >正解（1行につき1つ）<textarea
          id="editReportedAnswers"
          rows="5"
        ></textarea></label
      ><label id="explanationField"
        >解説<textarea id="editReportedExplanation" rows="5"></textarea></label
      ><button id="saveReportedQuestion" class="main-button">
        修正して公開問題へ反映
      </button>
      <p class="attendance-personal-notice">
        保存すると学生に公開中の問題と管理者編集データの両方へ反映し、この通報を対応済みにします。
      </p>
    </main>
    <script type="module" src="page_bootstrap.js?v=20261030-1" data-care-page data-role="admin" data-entry="./question_report_edit.js?v=20261028-3"></script>
  </body>
</html>
