<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お問い合わせ | CareMate</title><link rel="stylesheet" href="style.css"><script>if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark")</script><style>.contact-thread{display:flex;flex-direction:column;gap:.65rem;margin-bottom:14px;border:1px solid color-mix(in srgb,var(--primary) 20%,var(--border));background:var(--card)}.contact-thread>p.contact-bubble,.contact-thread div[id^="messages-"] p.contact-bubble{max-width:80%;width:fit-content;margin:0;padding:.7rem .85rem;border-radius:18px;background:var(--accent);color:var(--text);line-height:1.55;align-self:flex-start}.contact-thread div[id^="messages-"]{display:flex;flex-direction:column;gap:.45rem}.contact-thread div[id^="messages-"] p.contact-bubble.student{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:5px}.contact-thread>p.contact-bubble.student,.contact-thread div[id^="messages-"] p.contact-bubble.admin{border-bottom-left-radius:5px}.contact-thread textarea{min-height:72px}.dark .contact-thread>p.contact-bubble,.dark .contact-thread div[id^="messages-"] p.contact-bubble{background:color-mix(in srgb,var(--accent) 32%,var(--card))}</style></head><body class="page-loading"><div class="top-buttons"><button id="backButton" class="circle-button">←</button><h2>💬 お問い合わせ</h2><button id="themeButton" class="circle-button">🌙</button></div><main id="contactList"><div class="card setting-card">読み込み中...</div></main><script type="module" src="contact_chat.js"></script></body></html>
