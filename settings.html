<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="caremate_shell.css?v=20261020-2">
  <title>設定 | CareMate</title>
</head>
<body class="caremate-renewed">
  <main class="cm-main">
    <header class="cm-header"><div><span class="cm-brand">CareMate</span><h1 class="cm-title">設定</h1></div></header>
    <section class="cm-panel">
      <h2>アカウント</h2>
      <p id="accountSummary" class="cm-subtitle">読み込み中…</p>
    </section>
    <section class="cm-panel">
      <h2>アプリ用パスワード</h2>
      <form id="passwordForm">
        <label class="cm-field">現在のパスワード<input id="currentPassword" type="password" autocomplete="current-password" required></label>
        <label class="cm-field">新しいパスワード<input id="newPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128" required></label>
        <label class="cm-field">新しいパスワード（確認）<input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128" required></label>
        <button class="cm-button cm-button-primary" type="submit">パスワードを変更</button>
      </form>
      <p id="passwordStatus" class="cm-status" role="status"></p>
    </section>
    <section class="cm-panel">
      <h2>manaba連携</h2>
      <p id="manabaStatus" class="cm-subtitle">確認中…</p>
      <form id="manabaForm">
        <label class="cm-field">manabaの新しいパスワード<input id="manabaPassword" type="password" autocomplete="off" required></label>
        <button class="cm-button" type="submit">保存して次回の取得に反映</button>
      </form>
      <p id="manabaSaveStatus" class="cm-status" role="status"></p>
    </section>
    <section class="cm-panel">
      <h2>課題の通知</h2>
      <label class="cm-toggle"><input id="notifyAssignment" type="checkbox">新しい課題を通知</label>
      <label class="cm-toggle"><input id="notifyReminder" type="checkbox">締切リマインダーを通知</label>
      <button id="enablePushButton" class="cm-button" type="button">この端末で通知を有効にする</button>
      <p id="pushStatus" class="cm-status" role="status"></p>
    </section>
    <section class="cm-panel"><button id="logoutButton" class="cm-button" type="button">ログアウト</button></section>
  </main>
  <nav class="cm-nav" aria-label="メインメニュー">
    <a href="app.html"><span aria-hidden="true">📝</span><span>テスト</span></a><a href="settings.html" data-role-tab="member" aria-current="page" hidden><span aria-hidden="true">👤</span><span>設定</span></a><a href="admin.html" data-role-tab="admin" hidden><span aria-hidden="true">⚙️</span><span>管理</span></a><a href="assignments.html"><span aria-hidden="true">📚</span><span>課題</span></a>
  </nav>
  <script type="module" src="page_bootstrap.js" data-care-page data-entry="./settings.js"></script>
</body>
</html>
