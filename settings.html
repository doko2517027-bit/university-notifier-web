<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>設定</title>

    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.json" />

    <link rel="stylesheet" href="style.css" />

    <script>
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>

  <body class="page-loading">
    <div class="top-buttons">
      <div class="top-user-info">
        <span id="userName"> Unknownさん </span>

        <span id="myRanking"></span>
      </div>

      <div class="top-right">
        <button id="themeButton" class="circle-button">🌙</button>

        <button id="profileButton" class="circle-button">
          <img
            id="topProfileImage"
            src="images/default.png"
            class="header-profile-image"
          />
        </button>
      </div>
    </div>

    <header class="header">
      <div class="logo">⚙️</div>

      <h1>設定</h1>

      <p>CareMateApp</p>
    </header>

    <h2>登録情報</h2>

    <div class="card setting-card">
      <p><b>学籍番号</b></p>
      <p id="studentNumberText"></p>
      <p><b>氏名</b></p>
      <p id="registeredNameText"></p>

      <p><b>学科</b></p>
      <p id="departmentText"></p>

      <p><b>専攻</b></p>
      <p id="majorText"></p>

      <p><b>学年</b></p>
      <p id="gradeText"></p>
      <p><b>卒業予定</b></p>
      <p id="graduationText"></p>
    </div>

    <h2>パスワード変更</h2>
    <div class="card setting-card settings-form-stack">
      <label
        >Manaba 新しいパスワード<input
          id="newManabaPassword"
          type="password"
          autocomplete="new-password"
      /></label>
      <button id="saveManabaPassword" class="btn btn-secondary">
        Manabaを変更
      </button>
      <label
        >ActiveMail 新しいパスワード<input
          id="newActiveMailPassword"
          type="password"
          autocomplete="new-password"
      /></label>
      <button id="saveActiveMailPassword" class="btn btn-secondary">
        ActiveMailを変更
      </button>
      <label
        >CareMate 新しいパスワード<input
          id="newCareMatePassword"
          type="password"
          autocomplete="new-password"
      /></label>
      <label
        >CareMate 確認入力<input
          id="confirmCareMatePassword"
          type="password"
          autocomplete="new-password"
      /></label>
      <button id="saveCareMatePassword" class="btn btn-primary">
        CareMateを変更
      </button>
    </div>

    <h2>お問い合わせ</h2>
    <div class="card setting-card settings-form-stack">
      <label
        >種類<select id="contactCategory">
          <option>不具合</option>
          <option>使い方</option>
          <option>要望</option>
          <option>その他</option>
        </select></label
      >
      <label
        >内容<textarea
          id="contactMessage"
          rows="5"
          maxlength="2000"
          placeholder="お問い合わせ内容を入力"
        ></textarea>
      </label>
      <button id="sendContact" class="btn btn-primary">送信する</button>
      <a
        id="contactChatLink"
        class="btn btn-secondary"
        href="contact_chat.html"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          text-decoration: none;
          box-sizing: border-box;
        "
        >💬 お問い合わせの履歴・返信を見る</a
      >
      <a id="contactInboxLink" href="contact_admin.html" hidden
        >📨 お問い合わせ管理</a
      >
    </div>

    <h2>アプリ情報</h2>

    <div class="card setting-card">
      <p id="versionText"></p>
    </div>

    <h2>通知設定</h2>

    <div class="card setting-card">
      <button id="enablePushButton" class="btn btn-primary">
        🔔 通知を有効にする
      </button>

      <br /><br />

      <label class="setting-row">
        <span>
          <b>🗓 時間割変更</b><br />
          <small>時間割PDFに変更があった時</small>
        </span>
        <input type="checkbox" id="notifySchedule" />
      </label>

      <label class="setting-row">
        <span>
          <b>📢 コースニュース</b><br />
          <small>コースニュースに新しいお知らせが出た時</small>
        </span>
        <input type="checkbox" id="notifyCourseNews" />
      </label>

      <label class="setting-row">
        <span>
          <b>📚 新しい課題</b><br />
          <small>Manabaに新しい未提出課題が出た時</small>
        </span>
        <input type="checkbox" id="notifyAssignment" />
      </label>

      <label class="setting-row">
        <span>
          <b>⏰ 課題リマインダー</b><br />
          <small>締切前にお知らせ</small>
        </span>
        <input type="checkbox" id="notifyReminder" />
      </label>

      <label id="systemNewsRow" class="setting-row">
        <span>
          <b>💙 CareMateからのお知らせ</b><br />
          <small>運営からのお知らせが投稿された時</small>
        </span>
        <input type="checkbox" id="notifySystemNews" />
      </label>
    </div>

    <h2>アカウント</h2>

    <div class="card setting-card">
      <p>ログアウト後はログイン画面に戻ります。</p>

      <button id="logout" class="btn btn-primary">ログアウト</button>
    </div>

    <h2>危険な操作</h2>

    <div class="card setting-card">
      <p>登録情報・通知設定を削除します。</p>

      <button id="unregister" class="btn btn-danger">登録解除</button>
    </div>

    <nav class="bottom-nav">
      <a href="index.html">
        🏠<br />
        <span>ホーム</span>
      </a>

      <a href="assignments.html">
        <span class="nav-icon-wrap">
          <span class="nav-icon">📚</span>

          <span id="assignmentNavBadge" class="nav-notification-badge" hidden>
            0
          </span>
        </span>

        <span>課題</span>
      </a>

      <a href="requests.html">
        <span class="nav-icon-wrap">
          <span class="nav-icon">💡</span>

          <span id="shareNavBadge" class="nav-notification-badge" hidden>
            0
          </span>
        </span>

        <span>リクエスト</span>
      </a>

      <a href="news.html">
        <span class="nav-icon-wrap">
          <span class="nav-icon">📢</span>

          <span id="newsNavBadge" class="nav-notification-badge" hidden>
            0
          </span>
        </span>

        <span>お知らせ</span>
      </a>

      <a id="settingsTab" href="settings.html" class="active">
        ⚙️<br />
        <span>設定</span>
      </a>
    </nav>

    <script type="module" src="settings.js"></script>
  </body>
</html>
