<html lang="ja">

<body class="caremate-renewed cm-admin-page">
  <main class="cm-main">
    <header class="cm-header"><div><span class="cm-brand">CareMate</span><h1 class="cm-title">ユーザーと権限</h1><p class="cm-subtitle">ユーザーを探して管理します。パスワードは表示・取得されません。</p></div></header>
    <section class="cm-panel">
      <div class="cm-calendar-header"><h2>登録ユーザー <span id="userCount" class="cm-count"></span></h2><button id="refreshUsers" class="cm-button cm-button-compact" type="button">更新</button></div>

      <p id="rolePolicyHint" class="cm-admin-hint"></p>
      <div id="adminUserList" class="cm-list" aria-live="polite">読み込み中…</div>
      <p id="adminUsersStatus" class="cm-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <nav class="cm-nav" aria-label="メインメニュー"></nav>
