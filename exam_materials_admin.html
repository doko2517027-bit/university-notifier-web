<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>資料管理 | CareMate</title>

    <link rel="stylesheet" href="style.css?v=20261001-14" />
    <script defer src="loading_indicator.js?v=20260929-7"></script>

    <script>
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>

  <body class="page-loading exam-editor-body">
    <div class="top-buttons">
      <button id="backButton" class="circle-button">←</button>

      <h2>📄 資料管理</h2>

      <div class="top-right">
        <button id="themeButton" class="circle-button">🌙</button>

        <button id="profileButton" class="circle-button">
          <img
            id="topProfileImage"
            src="images/default.png"
            class="header-profile-image"
          />
        </button>
      </div>
    </div>

    <main class="exam-editor-workspace">
      <header class="exam-editor-hero">
        <p class="exam-admin-eyebrow">MATERIALS</p>
        <h1>資料を管理</h1>
        <p id="unitInfo">読み込み中...</p>
      </header>
      <div class="exam-editor-material-grid">
        <section class="exam-editor-action-panel">
          <h2>資料を追加</h2>
          <p>PDF・文書・画像・音声を選んで登録します。</p>
          <input type="file" id="materialFile" accept=".pdf,.doc,.docx,.ppt,.pptx,image/*,audio/*" />
          <button id="uploadMaterial" type="button" class="btn btn-primary">アップロード</button>
        </section>
        <section class="exam-editor-action-panel">
          <h2>AI問題を作成</h2>
          <p>登録済み資料から重要ポイントを抽出して問題を作成します。</p>
          <button id="generateAiQuestions" type="button" class="btn btn-primary">AIで問題を作成</button>
        </section>
      </div>
      <section class="exam-editor-action-panel">
        <h2>登録済み資料</h2>
        <div id="materialList">読み込み中...</div>
      </section>
    </main>

    <script type="module" src="exam_materials_admin.js?v=20260929-11"></script>
  </body>
</html>
