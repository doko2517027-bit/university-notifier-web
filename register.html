<!doctype html>
<html lang="ja">
  <head>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>初回登録 | CareMateApp</title>

    <link rel="stylesheet" href="style.css?v=20261001-5" />
    <script defer src="loading_indicator.js?v=20260929-7"></script>
    <script>
      if (localStorage.getItem("theme") === "dark")
        document.documentElement.classList.add("dark");
    </script>
  </head>

  <body class="page-loading">
    <div class="top-buttons">
      <button id="backButton" class="circle-button">←</button>
    </div>

    <header class="header">
      <div class="logo">🎓</div>

      <h1>CareMateApp</h1>

      <p>初回登録</p>
    </header>

    <div class="card setting-card account-role-card">
      <h3>登録する方</h3>
      <div class="account-role-switch" role="tablist" aria-label="登録する方を選択">
        <button id="studentRoleButton" type="button" class="btn btn-primary is-active">学生</button>
        <button id="guardianRoleButton" type="button" class="btn">保護者</button>
      </div>
      <p class="account-role-note">学生は従来どおり登録できます。保護者は学生が発行した連携コードが必要です。</p>
    </div>

    <div class="card setting-card student-registration-section">
      <h3>所属</h3>

      <p><b>学科</b></p>
      <select id="department">
        <option value="">選択してください</option>
        <option>看護学科</option>
      </select>

      <p><b>学科の学年</b></p>
      <select id="departmentGrade" disabled>
        <option value="">選択してください</option>
        <option>1年</option>
        <option>2年</option>
        <option>3年</option>
        <option>4年</option>
      </select>

      <hr />

      <p><b>専攻</b></p>
      <select id="major">
        <option value="">選択してください</option>
        <option>理学療法学専攻</option>
        <option>作業療法学専攻</option>
      </select>

      <p><b>専攻の学年</b></p>
      <select id="majorGrade" disabled>
        <option value="">選択してください</option>
        <option>1年</option>
        <option>2年</option>
        <option>3年</option>
        <option>4年</option>
      </select>
    </div>

    <div class="card setting-card student-registration-section">
      <h3>学生情報</h3>

      <p><b>学籍番号 必須</b></p>
      <input
        id="studentNumber"
        type="text"
        maxlength="7"
        placeholder="例：2510000"
      />
      <p id="registrationGradeHint">学籍番号の先頭2桁から初回登録時の学年を判定します。</p>

      <p><b>学生ページID 必須</b></p>
      <input id="studentPageId" type="text" placeholder="学生ページID" />

      <p><b>学生ページパスワード 必須</b></p>
      <input
        id="studentPagePassword"
        type="password"
        placeholder="学生ページのパスワード"
      />
    </div>

    <div class="card setting-card student-registration-section">
      <h3>追加ログイン情報</h3>

      <p><b>Active!Mailパスワード 任意</b></p>
      <input
        id="activeMailPassword"
        type="password"
        placeholder="未入力でも登録できます"
      />

      <p><b>manabaパスワード 任意</b></p>
      <input
        id="manabaPassword"
        type="password"
        placeholder="未入力でも登録できます"
      />
    </div>

    <div class="card setting-card student-registration-section">
      <h3>アプリログイン</h3>

      <p><b>アプリ用パスワード 必須</b></p>
      <input
        id="appPassword"
        type="password"
        placeholder="アプリにログインするパスワード"
      />

      <p><b>アプリ用パスワード確認 必須</b></p>
      <input
        id="appPasswordConfirm"
        type="password"
        placeholder="もう一度入力"
      />

      <br /><br />

      <button id="subscribe" class="btn btn-primary">登録</button>
    </div>

    <div id="guardianRegistration" class="card setting-card guardian-registration-section" hidden>
      <h3>保護者登録</h3>
      <p>学生本人の設定画面で発行した連携コードを使います。</p>
      <label><b>連携する学生の学籍番号</b>
        <input id="guardianStudentNumber" type="text" inputmode="numeric" maxlength="7" placeholder="例：2510000" />
      </label>
      <label><b>連携コード</b>
        <input id="guardianInviteCode" type="text" maxlength="8" autocomplete="one-time-code" placeholder="8文字のコード" />
      </label>
      <label><b>保護者のお名前</b>
        <input id="guardianDisplayName" type="text" maxlength="60" placeholder="例：保護者氏名" />
      </label>
      <label><b>保護者用パスワード</b>
        <input id="guardianPassword" type="password" minlength="6" autocomplete="new-password" placeholder="6文字以上" />
      </label>
      <label><b>パスワード確認</b>
        <input id="guardianPasswordConfirm" type="password" minlength="6" autocomplete="new-password" placeholder="もう一度入力" />
      </label>
      <button id="guardianSubscribe" type="button" class="btn btn-primary">保護者として登録</button>
    </div>

    <footer id="version"></footer>

    <script type="module" src="register.js?v=20261001-2"></script>
  </body>
</html>
