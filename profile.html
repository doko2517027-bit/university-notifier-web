<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>プロフィール</title>

<link rel="stylesheet" href="style.css">

<script>
if(localStorage.getItem("theme")==="dark"){
    document.documentElement.classList.add("dark");
}
</script>

</head>

<body>

    <div class="top-buttons">

        <button id="backButton" class="circle-button">
        ←
        </button>

        <h2>プロフィール</h2>

        <div style="width:44px"></div>

        <div class="top-right">

        <button id="themeButton" class="circle-button">
            🌙
        </button>

    </div>

    <input
        type="file"
        id="photoPicker"
        accept="image/*"
        hidden>

    <div id="photoMenu" class="photo-menu">

        <div class="photo-sheet">

            <button id="choosePhoto">
                📷 写真ライブラリ
            </button>

            <button id="takePhoto">
                📸 写真を撮る
            </button>

            <button id="resetPhoto">
                👤 初期アイコンに戻す
            </button>

            <button id="cancelPhoto">
                キャンセル
            </button>

        </div>

    </div>

    </div>

    <div class="card profile-card">

        <img
            id="profileImage"
            src="images/default.png">

        <h2 id="userName">

        </h2>

        <p id="studentNumber">

        </p>

    </div>

    <h2>🏆 ランキング表示名</h2>

    <div class="card setting-card">

        <p>
            <b>ランキングに表示する名前</b>
        </p>

        <p>
            <small>
                ここで設定した内容はランキングだけに使用されます。
                上に表示されている自分用の名前は変更されません。
            </small>
        </p>

        <label for="rankingNicknameInput">
            <b>ニックネーム</b>
        </label>

        <br><br>

        <input
            id="rankingNicknameInput"
            type="text"
            maxlength="20"
            autocomplete="off"
            placeholder="例：ケアメイト">

        <br><br>

        <label for="rankingDisplayMode">
            <b>ランキングでの表示</b>
        </label>

        <br><br>

        <select id="rankingDisplayMode">

            <option value="nickname">
                ニックネーム
            </option>

            <option value="student_number">
                学籍番号
            </option>

        </select>

        <p
            id="rankingNicknameStatus"
            style="
                margin-top:14px;
                color:var(--subtext);
            ">
            読み込み中...
        </p>

        <button
            id="saveRankingNicknameButton"
            type="button"
            class="btn btn-primary">
            ランキング表示名を保存
        </button>

    </div>

    <script
        type="module"
        src="profile.js">

    </script>

</body>

</html>
