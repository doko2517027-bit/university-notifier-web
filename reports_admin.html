<!doctype html>
<html lang="ja">
  <head>
    <script src="ui_preferences.js?v=20261028-2"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>テスト問題の報告 | CareMate</title>
    <link rel="stylesheet" href="style.css?v=20261020-3" />
    <script defer src="loading_indicator.js?v=20261028-2"></script>
    <script>
      if (localStorage.getItem("theme") === "dark")
        document.documentElement.classList.add("dark");
    </script>
    <link rel="stylesheet" href="caremate_shell.css?v=20261020-6">
  </head>
  <body class="page-loading">
    <div class="top-buttons">
      <button id="backButton" class="circle-button">←</button>
      <h2 class="report-page-title">
        テスト問題の報告
        <span id="reportsUnresolvedBadge" class="admin-card-badge" hidden
          >0</span
        >
      </h2>
      <div class="top-right">
        <button id="themeButton" class="circle-button">🌙</button>
      </div>
    </div>
    <div class="report-tabs">
      <button id="showOpenReports" class="btn btn-primary">
        未解決 <span id="openReportCount">0</span></button
      ><button id="showResolvedReports" class="btn">
        解決済み <span id="resolvedReportCount">0</span>
      </button>
    </div>
    <section id="openReportsSection">
      <div id="openReportList">
        <div class="card setting-card">読み込み中...</div>
      </div>
    </section>
    <section id="resolvedReportsSection" hidden>
      <div id="resolvedReportList"></div>
    </section>
    <nav class="bottom-nav">
      <a href="app.html">📝<br /><span>テスト</span></a
      ><a href="assignments.html">📚<br /><span>課題</span></a
      ><a id="settingsTab" href="admin.html" class="active"
        >👑<br /><span>管理</span></a
      >
    </nav>
    <script type="module" src="page_bootstrap.js?v=20261028-2" data-care-page data-role="admin" data-entry="./reports_admin.js?v=20261028-2"></script>
  </body>
</html>
