<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>紹介制度管理 | CareMateApp</title>
    <link rel="stylesheet" href="style.css?v=20261001-13" />
    <script defer src="loading_indicator.js?v=20260929-7"></script>
    <script>
      if (localStorage.getItem("loggedIn") !== "true") location.replace("login.html");
      if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
    </script>
  </head>
  <body class="page-loading referral-admin-page">
    <div class="top-buttons">
      <button id="backButton" class="circle-button" type="button">←</button>
      <div class="top-right"><button id="themeButton" class="circle-button" type="button">🌙</button></div>
    </div>
    <header class="header"><div class="logo">🎁</div><h1>紹介制度管理</h1><p>全学生の紹介進捗・招待コード・成立履歴・特典をまとめて管理</p></header>
    <main class="referral-admin-shell">
      <section class="card referral-home-visibility-card">
        <div>
          <span class="referral-eyebrow">HOME DISPLAY</span>
          <h2>ホームの「友達招待」表示</h2>
          <p>オフにすると学生ホームの招待枠だけを隠します。紹介履歴・達成人数・特典データは削除されません。</p>
        </div>
        <label class="referral-visibility-switch">
          <input id="referralHomeVisible" type="checkbox" />
          <span aria-hidden="true"></span>
          <b id="referralHomeVisibilityLabel">読み込み中</b>
        </label>
      </section>
      <section class="referral-admin-summary">
        <article class="card"><small>対象学生</small><strong id="referralStudentTotal">--</strong></article>
        <article class="card"><small>紹介成立</small><strong id="referralTotal">--</strong></article>
        <article class="card"><small>使用中コード</small><strong id="activeCodeTotal">--</strong></article>
        <article class="card"><small>10人達成</small><strong id="rewardTotal">--</strong></article>
        <article class="card"><small>ギフト未付与</small><strong id="rewardPending">--</strong></article>
      </section>
      <section class="card referral-admin-list-card">
        <div class="referral-section-heading"><div><span class="referral-eyebrow">REFERRALS</span><h2>学生別の紹介状況</h2></div><button id="refreshRewards" class="btn" type="button">↻ 更新</button></div>
        <div class="referral-admin-toolbar">
          <input id="referralSearch" type="search" placeholder="学籍番号・名前で検索" aria-label="紹介状況を検索" />
          <select id="referralFilter" aria-label="紹介状況で絞り込み">
            <option value="all">すべて</option>
            <option value="progress">1人以上</option>
            <option value="active-code">使用中コードあり</option>
            <option value="reached">10人達成</option>
            <option value="pending">ギフト未付与</option>
          </select>
        </div>
        <p class="referral-safety-note">学生カードを開くと、マイルストーン、現在の招待コード、紹介成立者と日時、ギフト状態を確認できます。ギフトは自動発行されません。</p>
        <div id="rewardList" class="referral-admin-list">読み込み中...</div>
      </section>
    </main>
    <nav class="bottom-nav">
      <a href="index.html"><span class="nav-icon-wrap"><span class="nav-icon">🏠</span></span><span>ホーム</span></a>
      <a href="calendar.html"><span class="nav-icon-wrap"><span class="nav-icon">📅</span></span><span>カレンダー</span></a>
      <a href="assignments.html"><span class="nav-icon-wrap"><span class="nav-icon">📚</span></span><span>課題</span></a>
      <a href="requests.html"><span class="nav-icon-wrap"><span class="nav-icon">💡</span></span><span>リクエスト</span></a>
      <a href="news.html"><span class="nav-icon-wrap"><span class="nav-icon">📢</span></span><span>お知らせ</span></a>
      <a class="active" href="admin.html"><span class="nav-icon-wrap"><span class="nav-icon">👑</span></span><span>管理</span></a>
    </nav>
    <script type="module" src="referral_admin.js?v=20261001-3"></script>
  </body>
</html>
