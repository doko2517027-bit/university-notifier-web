<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>問題一覧 | CareMate</title>

    <link rel="stylesheet" href="style.css?v=20261002-1" />
    <script defer src="loading_indicator.js?v=20260929-7"></script>

    <script>
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>

  <body class="page-loading exam-editor-body">
    <div class="top-buttons">
      <button id="backButton" class="circle-button">←</button>

      <h2>📝 問題一覧</h2>

      <div class="top-right">
        <button id="themeButton" class="circle-button">🌙</button>

        <button id="profileButton" class="circle-button">
          <img
            id="topProfileImage"
            src="images/default.png"
            class="header-profile-image"
          />
        </button>
      </div>
    </div>

    <main class="exam-editor-workspace">
      <header class="exam-editor-hero">
        <p class="exam-admin-eyebrow">QUESTION EDITOR</p>
        <h1>問題を管理</h1>
        <p id="unitInfo">読み込み中...</p>
      </header>

      <div class="exam-editor-top-grid">
        <section class="exam-editor-action-panel" aria-labelledby="examEditorPublishTitle">
          <h2 id="examEditorPublishTitle">保存・公開</h2>
          <p>内容を編集して保存し、学生に見せるときに公開してください。</p>
          <div class="exam-editor-actions">
            <button id="saveEditedQuestions" type="button" class="btn btn-secondary">編集内容を保存</button>
            <button id="publishQuestions" type="button" class="btn btn-primary">学生に公開</button>
          </div>
        </section>

        <details class="exam-editor-import">
          <summary>JSONを一括インポート</summary>
          <div class="exam-editor-import-body">
            <p>複数の問題をまとめて追加するときに使います。</p>
            <textarea id="jsonImport" rows="8" placeholder="ここにJSONを貼り付け"></textarea>
            <div class="exam-editor-actions">
              <button id="previewJson" type="button" class="btn btn-secondary">内容を確認</button>
              <button id="importJson" type="button" class="btn btn-primary">JSONを保存</button>
            </div>
            <div id="jsonPreview"></div>
          </div>
        </details>
      </div>

      <div class="exam-editor-section-heading"><h2>編集項目</h2><p>編集する項目だけ開けます。</p></div>
      <div id="questionList" class="exam-editor-question-list">読み込み中...</div>
    </main>

    <script type="module" src="exam_questions_admin.js?v=20260929-12"></script>
  </body>
</html>
