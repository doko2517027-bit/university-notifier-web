<!doctype html>
<html lang="ja">
  <head>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ログイン | CareMateApp</title>
    <link rel="stylesheet" href="style.css?v=20261001-5" />
    <script defer src="loading_indicator.js?v=20260929-7"></script>
    <script>
      if (localStorage.getItem("theme") === "dark")
        document.documentElement.classList.add("dark");
    </script>
  </head>
  <body class="page-loading">
    <header class="header">
      <div class="logo">🎓</div>
      <h1>CareMateApp</h1>
      <p>ログイン</p>
    </header>

    <div class="card setting-card">
      <div class="account-role-switch" role="tablist" aria-label="ログインする方を選択">
        <button id="studentLoginRole" type="button" class="btn btn-primary is-active">学生</button>
        <button id="guardianLoginRole" type="button" class="btn">保護者</button>
      </div>
      <h3 id="loginIdentifierLabel">学籍番号</h3>
      <input
        id="studentNumber"
        type="text"
        maxlength="7"
        placeholder="例：2510000"
      />

      <h3 id="loginPasswordLabel">アプリ用パスワード</h3>
      <input
        id="appPassword"
        type="password"
        placeholder="登録したパスワード"
      />

      <button id="loginButton" class="btn btn-primary">ログイン</button>

      <br /><br />

      <button id="registerButton" class="btn btn-primary">
        初回登録はこちら
      </button>
    </div>

    <script type="module" src="login.js?v=20261001-1"></script>
  </body>
</html>
