<!doctype html>
<html lang="ja">
  <head>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ログイン | CareMateApp</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      if (localStorage.getItem("theme") === "dark")
        document.documentElement.classList.add("dark");
    </script>
  </head>
  <body>
    <header class="header">
      <div class="logo">🎓</div>
      <h1>CareMateApp</h1>
      <p>ログイン</p>
    </header>

    <div class="card setting-card">
      <h3>学籍番号</h3>
      <input
        id="studentNumber"
        type="text"
        maxlength="7"
        placeholder="例：2510000"
      />

      <h3>アプリ用パスワード</h3>
      <input
        id="appPassword"
        type="password"
        placeholder="登録したパスワード"
      />

      <button id="loginButton" class="btn btn-primary">ログイン</button>

      <p class="login-device-privacy-note">
        アカウントの不正共有を確認するため、ランダムな端末ID、端末・OS・ブラウザの種類、利用時刻、接続元IPのマスク表示とIP由来の推定地域を記録します。推定地域の取得には外部サービスを利用しますが、GPS・緯度経度・端末指紋は収集しません。情報は指定管理者（2510044）の確認に限り使用し、推定地域は実際の現在地と異なる場合があります。
      </p>

      <br /><br />

      <button id="registerButton" class="btn btn-primary">
        初回登録はこちら
      </button>
    </div>

    <script type="module" src="login.js"></script>
  </body>
</html>
