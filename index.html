<!DOCTYPE html>
<html lang="ja">

<head>
    <script src="ui_preferences.js?v=20261028-2"></script>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#2563eb">

    <link rel="manifest" href="manifest.json">

    <title>CareMate</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f8fafc;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            color: #1e293b;
        }

        [hidden] {
            display: none !important;
        }

        .container {
            width: 100%;
            max-width: 460px;
        }

        /* =============================
           サービス終了のお知らせ
        ============================= */

        .notice {
            background: white;
            border-radius: 24px;
            padding: 44px 28px;
            text-align: center;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.04);
        }

        h1 {
            font-size: 30px;
            margin: 0 0 32px;
            font-weight: 700;
        }

        h2 {
            font-size: 19px;
            margin-bottom: 24px;
        }

        p {
            font-size: 14px;
            line-height: 2;
            color: #64748b;
        }

        /* =============================
           Google検索風の入力欄
        ============================= */

        .search-box {
            display: flex;
            align-items: center;

            background: white;

            border: 1px solid #e2e8f0;
            border-radius: 50px;

            padding: 8px 16px;
            margin-top: 35px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.04);
        }

        .search-box input {
            flex: 1;
            min-width: 0;

            border: none;
            outline: none;

            padding: 10px;
            font-size: 16px;

            background: transparent;
        }

        .search-box button {
            border: none;
            background: transparent;

            font-size: 20px;
            cursor: pointer;

            padding: 5px 10px;
            color: #64748b;
        }

        .search-box button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .entry-message {
            min-height: 20px;
            margin-top: 14px;

            text-align: center;
            font-size: 13px;

            color: #64748b;
        }

        /* =============================
           ログイン画面
        ============================= */

        .login-view {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .login-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .login-logo {
            width: 56px;
            height: 56px;
            display: grid;
            place-items: center;
            margin: 0 auto 12px;
            border-radius: 17px;
            background: #2d65bd;
            color: #fff;
            font-size: 29px;
            box-shadow: 0 8px 20px rgba(45, 101, 189, .2);
        }

        .login-header h1 {
            color: #1e3455;
            font-size: clamp(26px, 7vw, 30px);
            margin: 0 0 6px;
        }

        .login-header p {
            margin: 0;
            font-size: 15px;
            color: #61728c;
        }

        .login-card {
            background: white;
            padding: clamp(22px, 6vw, 34px);
            border: 1px solid #e0e8f4;
            border-radius: 20px;
            box-shadow: 0 12px 34px rgba(32, 54, 86, .07);
        }

        .login-card label {
            display: block;

            color: #324662;
            font-size: 15px;
            font-weight: 750;
            margin: 17px 0 8px;
        }

        .login-card input {
            width: 100%;
            min-height: 54px;
            padding: 12px 14px;
            border: 1px solid #cbd8e8;
            border-radius: 12px;
            background: #fff;
            color: #26364f;
            font-size: 17px;
        }

        .login-card input:focus {
            outline: 3px solid rgba(79, 131, 214, .2);
            border-color: #4f83d6;
        }

        .login-card button {
            width: 100%;

            min-height: 56px;
            margin-top: 24px;
            padding: 13px 16px;

            background: #2563eb;
            color: white;

            border: none;
            border-radius: 13px;

            font-size: 17px;
            font-weight: 800;

            cursor: pointer;
        }

        .login-card button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-message {
            text-align: center;
            color: #b42332;
            font-size: 14px;
            line-height: 1.5;
            margin: 14px 0 0;
        }

    </style>

</head>

<body class="cm-login-page cm-entry-notice">

    <!-- =====================================
         ① 一般利用者向け終了画面
    ===================================== -->

    <main id="closedView" class="container">

        <section class="notice">

            <h1>CareMate</h1>

            <h2>サービス終了のお知らせ</h2>

            <p>
                CareMateのサービスは<br>
                終了いたしました。
            </p>

            <p>
                サービスの提供は終了しました。<br>
                登録情報については削除済みです。
            </p>

            <p>
                これまでご利用いただき、<br>
                誠にありがとうございました。
            </p>

        </section>


        <!-- Google検索風の入力欄 -->

        <form
            id="entryForm"
            class="search-box"
            autocomplete="off"
        >

            <input
                type="text"
                id="entryCode"
                placeholder="検索"
                autocomplete="off"
                spellcheck="false"
                aria-label="検索"
                maxlength="120"
            >

            <button
                id="entryButton"
                type="submit"
                aria-label="検索する"
            >
                ⌕
            </button>

        </form>

        <p
            id="entryMessage"
            class="entry-message"
            role="status"
            aria-live="polite"
        ></p>

    </main>


    <!-- =====================================
         ② 認証後のログイン画面
    ===================================== -->

    <main
        id="loginView"
        class="login-view"
        hidden
    >

        <div class="login-header">

            <div class="login-logo">🎓</div>

            <h1>CareMate</h1>

            <p>ログイン</p>

        </div>


        <div class="login-card">

            <label for="studentNumber">
                学籍番号
            </label>

            <input
                id="studentNumber"
                type="text"
                inputmode="numeric"
                maxlength="7"
                placeholder="例：2510000"
                autocomplete="username"
            >


            <label for="appPassword">
                アプリ用パスワード
            </label>

            <input
                id="appPassword"
                type="password"
                placeholder="登録したパスワード"
                autocomplete="current-password"
            >


            <button
                id="loginButton"
                type="button"
            >
                ログイン
            </button>

            <p
                id="loginMessage"
                class="login-message"
                role="status"
            ></p>

        </div>

    </main>


    <!-- =====================================
         ③ 画面切り替え・ワンタイム認証
    ===================================== -->

    <script type="module">

        // ====================================
        // HTML要素
        // ====================================

        const closedView =
            document.getElementById("closedView");

        const loginView =
            document.getElementById("loginView");

        const entryForm =
            document.getElementById("entryForm");

        const entryCode =
            document.getElementById("entryCode");

        const entryButton =
            document.getElementById("entryButton");

        const entryMessage =
            document.getElementById("entryMessage");

        const loginMessage =
            document.getElementById("loginMessage");


        // ====================================
        // この端末で入口を通過したか
        // ====================================

        const LOGIN_ENABLED_KEY =
            "caremateLoginEnabled";


        // ====================================
        // ログイン画面を表示
        // ====================================

        let loginInitialized = false;

        async function showLoginScreen() {

            // サービス終了画面を非表示
            closedView.hidden = true;

            // ログイン画面を表示
            loginView.hidden = false;
            document.body.classList.remove("cm-entry-notice");

            // login.jsの二重読み込みを防止
            if (loginInitialized) {
                return;
            }

            loginInitialized = true;

            try {

                // 既存のログイン処理を読み込む
                await import(
                    "./login.js?v=20261028-2"
                );

            } catch (error) {

                console.error(
                    "ログイン画面の初期化エラー:",
                    error
                );

                loginMessage.textContent =
                    "ログイン機能を読み込めませんでした。ページを再読み込みしてください。";

            }

        }


        // ====================================
        // 初回表示
        // ====================================

        // 一度入口を通過した端末では、
        // 次回から終了案内を表示しない

        if (
            localStorage.getItem(
                LOGIN_ENABLED_KEY
            ) === "true"
        ) {

            showLoginScreen();

        }


        // ====================================
        // 検索欄の送信処理
        // ====================================

        entryForm.addEventListener(
            "submit",

            async (event) => {

                event.preventDefault();

                const phrase =
                    entryCode.value.trim();

                // 空欄では検索しない
                if (!phrase) {
                    return;
                }

                // 二重送信防止
                entryButton.disabled = true;

                entryMessage.textContent =
                    "検索中…";

                // 入力した文言を画面から消す
                entryCode.value = "";


                try {

                    // ====================================
                    // Firebaseを読み込む
                    // ====================================

                    const { callCareMate } = await import("./backend_client.js?v=20261028-2");
                    const result = await callCareMate("redeemEntrancePhrase", { phrase });


                    // ====================================
                    // 認証成功
                    // ====================================

                    if (
                        result.data?.ok === true
                    ) {

                        // この端末では次回から
                        // ログイン画面を直接表示

                        localStorage.setItem(
                            LOGIN_ENABLED_KEY,
                            "true"
                        );
                        localStorage.setItem("caremateEntranceGrant", String(result.data?.grant || ""));
                        localStorage.setItem("caremateExperienceMode", result.data?.experienceMode === "study-only" ? "study-only" : "assignments");

                        entryMessage.textContent = "";

                        // ログイン画面に切り替える
                        await showLoginScreen();

                        return;

                    }


                    // ====================================
                    // 認証失敗
                    // ====================================

                    // 入口文言ではなかった場合は通常のGoogle検索へ。
                    window.location.assign(
                        "https://www.google.com/search?q=" +
                        encodeURIComponent(phrase)
                    );


                } catch (error) {

                    console.error(
                        "入口認証エラー:",
                        error
                    );

                    entryMessage.textContent =
                        "検索を完了できませんでした。通信状態をご確認ください。";

                } finally {

                    entryButton.disabled = false;

                }

            }
        );

    </script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch((error) => console.warn("更新確認に失敗しました:", error));
      }
    </script>

</body>

</html>
