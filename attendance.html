<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>出席管理 | CareMateApp</title>

<link rel="stylesheet" href="style.css">


<script>
if(localStorage.getItem("theme")==="dark"){
    document.documentElement.classList.add("dark");
}
</script>

</head>


<body>


<header class="header">

    <div class="logo">
        📅
    </div>


    <h1>
        出席管理
    </h1>


    <p>
        授業の出席状況を確認できます
    </p>


</header>


<hr>



<h2>
📊 全体状況
</h2>



<div class="card setting-card">


    <h3>
        現在の出席率
    </h3>


    <div
        id="attendanceRate"
        style="
        font-size:36px;
        font-weight:bold;
        margin:20px 0;
        "
    >

        読み込み中...


    </div>



    <div
        id="attendanceSummary"
    >

        読み込み中...


    </div>


</div>




<h2>
📚 科目別
</h2>



<div id="attendanceList">


    <p class="empty-text">
        読み込み中...
    </p>


</div>





<h2>
⚠️ 試験資格
</h2>



<div class="card setting-card">


    <h3>
        定期試験受験資格
    </h3>



    <p
        id="examQualification"
    >

        確認中...


    </p>



    <p>
        出席率2/3未満の場合、定期試験を受けられません
    </p>


</div>





<script type="module" src="attendance.js"></script>


</body>


</html>
