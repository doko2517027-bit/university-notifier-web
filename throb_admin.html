<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Throb管理 | CareMate</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="throb_admin.css" />
    <script defer src="loading_indicator.js"></script>
    <script>
      if (localStorage.getItem('loggedIn') !== 'true') location.replace('login.html');
      if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    </script>
  </head>
  <body class="page-loading throb-admin-page">
    <main id="throbAdminRoot" class="throb-admin-shell" hidden>
      <header class="throb-admin-head">
        <a href="admin.html" class="throb-admin-back">← 管理へ戻る</a>
        <div><span class="throb-admin-eyebrow">2510044 限定テスト</span><h1>Throb管理</h1><p>抽選確率とテスト用ポイントの価格を調整します。保存後の抽選・購入から反映されます。</p></div>
        <button id="throbAdminTheme" type="button" class="circle-button" aria-label="テーマ変更">🌙</button>
      </header>

      <p id="throbAdminStatus" class="throb-admin-status" role="status">設定を読み込み中…</p>

      <form id="throbAdminForm">
        <section class="throb-admin-card">
          <div class="throb-admin-section-title"><div><h2>ガチャ排出率</h2><p>合計100%。SR以上を少なくとも1種類は設定してください。</p></div><strong id="throbRateTotal">—%</strong></div>
          <div id="throbRateGrid" class="throb-admin-grid"></div>
        </section>
        <section class="throb-admin-card">
          <div class="throb-admin-section-title"><div><h2>ガチャ価格</h2><p>1回と10連をそれぞれ設定できます。</p></div></div>
          <div id="throbPriceGrid" class="throb-admin-price-grid"></div>
        </section>
        <section class="throb-admin-card">
          <div class="throb-admin-section-title"><div><h2>ショップ価格</h2><p>低レアの直接購入。正式な学習ポイントには影響しません。</p></div></div>
          <div id="throbShopGrid" class="throb-admin-grid"></div>
        </section>
        <div class="throb-admin-actions"><button id="throbReload" type="button" class="throb-admin-secondary">再読み込み</button><button id="throbSave" type="submit" class="throb-admin-primary">設定を保存</button></div>
      </form>
      <p class="throb-admin-footnote">キャラクター・武器の能力設定、ユーザー対応、オンライン対戦管理は次の開発対象です。現在は2510044以外にゲーム本体を公開していません。</p>
    </main>
    <script type="module" src="throb_admin.js?v=1"></script>
  </body>
</html>
