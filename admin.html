<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="caremate_shell.css?v=20261020-1">
  <title>管理 | CareMate</title>
</head>
<body class="caremate-renewed">
  <main class="cm-main">
    <header class="cm-header"><div><span class="cm-brand">CareMate</span><h1 class="cm-title">管理</h1></div></header>
    <section class="cm-panel">
      <h2>テスト問題</h2>
      <p class="cm-subtitle">科目・単元・問題・公開設定とJSON一括登録を管理します。</p>
      <div class="cm-actions">
        <a class="cm-button cm-button-primary" href="exam_admin.html">問題と科目の管理</a>
      </div>
    </section>
    <section class="cm-panel">
      <h2>入口認証</h2>
      <p class="cm-subtitle">30分間・1回限りの入口文言を発行できます。</p>
      <a class="cm-button" href="entrance_admin.html">ワンタイム文言を発行</a>
    </section>
    <section class="cm-panel"><h2>問題の報告</h2><p class="cm-subtitle">学生から届いた答えの誤りの報告を確認します。</p><a class="cm-button" href="reports_admin.html">報告を確認する</a></section>
    <section class="cm-panel">
      <h2>利用アカウント</h2>
      <p class="cm-subtitle">現在利用を許可したアカウントです。</p>
      <div id="accessList" class="cm-list" aria-live="polite">読み込み中…</div>
    </section>
    <section class="cm-panel">
      <h2>管理者の設定</h2>
      <div class="cm-actions">
        <a class="cm-button" href="settings.html">パスワード・課題通知の設定</a>
        <button id="signOutButton" class="cm-button" type="button">ログアウト</button>
      </div>
    </section>
  </main>
  <nav class="cm-nav" aria-label="メインメニュー">
    <a href="app.html">テスト</a>
    <a href="admin.html" aria-current="page">管理</a>
    <a href="assignments.html">課題</a>
  </nav>
  <script type="module" src="page_bootstrap.js" data-care-page data-role="admin" data-entry="./admin_portal.js"></script>
</body>
</html>
