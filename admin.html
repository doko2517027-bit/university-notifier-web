<!doctype html>
<html lang="ja">
<head>
    <script src="ui_preferences.js?v=20261020-3"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2d65bd">
  <link rel="stylesheet" href="caremate_shell.css?v=20261020-6">
  <title>管理 | CareMate</title>
</head>
<body class="caremate-renewed">
  <main class="cm-main">
    <header class="cm-header"><div><span class="cm-brand">CareMate</span><h1 class="cm-title">管理</h1></div></header>
    <p class="cm-subtitle">学生アカウントとテスト対策を管理します。</p>
    <section class="cm-panel">
      <h2>ユーザー管理</h2>
      <p class="cm-subtitle">manaba・アプリパスワードの再設定、利用解除、新規登録を行います。</p>
      <a class="cm-button cm-button-primary" href="admin_users.html"><span aria-hidden="true">👥</span><span>ユーザー一覧を開く</span></a>
      <details class="cm-details">
        <summary>新しい学生を登録</summary>
        <form id="newAccountForm" class="cm-form-grid" autocomplete="off">
          <label class="cm-field">学籍番号<input id="newStudentNumber" type="text" inputmode="numeric" pattern="[0-9]{7}" minlength="7" maxlength="7" autocomplete="off" required></label>
          <label class="cm-field">氏名<input id="newStudentName" type="text" maxlength="80" autocomplete="off" required></label>
          <label class="cm-field">初期アプリパスワード<input id="newStudentPassword" type="password" minlength="6" maxlength="128" autocomplete="new-password" required></label>
          <button class="cm-button cm-button-primary" type="submit">学生を登録</button>
        </form>
        <p id="newAccountStatus" class="cm-status" role="status" aria-live="polite"></p>
      </details>
    </section>
    <section class="cm-panel">
      <h2>ワンタイムパスワード</h2>
      <p class="cm-subtitle">管理者が決めた文言を発行します。発行後10分で無効になり、1回だけ使えます。</p>
      <a class="cm-button" href="entrance_admin.html"><span aria-hidden="true">🔐</span><span>文言を発行する</span></a>
    </section>
    <section class="cm-panel">
      <h2>テスト管理</h2>
      <p class="cm-subtitle">従来のテスト管理画面を開きます。</p>
      <a class="cm-button" href="exam_admin.html"><span aria-hidden="true">📖</span><span>テスト管理を開く</span></a>
    </section>
    <section class="cm-panel"><button id="signOutButton" class="cm-button" type="button">管理者ログアウト</button></section>
  </main>
  <nav class="cm-nav" aria-label="メインメニュー"></nav>
  <script type="module" src="page_bootstrap.js" data-care-page data-role="admin" data-entry="./admin_portal.js"></script>
</body>
</html>
